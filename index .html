<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower for you</title>
<style>
body {
margin: 0;
padding: 0;
background-color: #0b0b0b;
font-family: monospace;
color: #fff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
overflow: hidden;
}

#message {
font-size: 26px;
letter-spacing: 3px;
margin-bottom: 20px;
text-align: center;
z-index: 10;
}

#open-btn {
background: transparent;
border: 1px solid #fff;
color: #fff;
padding: 10px 24px;
cursor: pointer;
font-size: 16px;
border-radius: 20px;
transition: 0.3s;
z-index: 10;
}

#open-btn:hover {
background: #fff;
color: #0b0b0b;
}

canvas {
display: block;
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 1;
}
</style>
</head>
<body>

<div id="message">I Have Something</div>
<button id="open-btn" onclick="startAnimation()">Open</button>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let particles = [];
let flowers = [];
let animationStarted = false;
let time = 0;

// Падающие точки на фоне
for (let i = 0; i < 100; i++) {
particles.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
size: Math.random() * 2 + 1,
speed: Math.random() * 1 + 0.5
});
}

function startAnimation() {
document.getElementById('open-btn').style.display = 'none';
document.getElementById('message').innerText = "I LOVE U BABE";
animationStarted = true;

// Генерируем цветы
let count = Math.floor(canvas.width / 70);
for (let i = 0; i < count; i++) {
flowers.push({
x: 40 + i * 70 + (Math.random() * 20 - 10),
height: 0,
maxHeight: Math.random() * 160 + 110,
speed: Math.random() * 2 + 1,
bloom: 0,
maxBloom: Math.random() * 8 + 14,
swayOffset: Math.random() * Math.PI * 2, // Смещение для уникального покачивания
swaySpeed: Math.random() * 0.02 + 0.015
});
}
}

function animate() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
time += 0.03;

// Рисуем точки
ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
particles.forEach(p => {
ctx.fillRect(p.x, p.y, p.size, p.size);
p.y += p.speed;
if (p.y > canvas.height) p.y = 0;
});

// Анимация цветов
if (animationStarted) {
flowers.forEach(f => {
// Расчет покачивания (чем выше стебель, тем сильнее качается верхушка)
let sway = Math.sin(time + f.swayOffset) * 15 * (f.height / f.maxHeight);
let targetX = f.x + sway;
let currentY = canvas.height - f.height;

// Стебель (изогнутая линия для естественности)
ctx.strokeStyle = '#2e7d32';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(f.x, canvas.height);
ctx.quadraticCurveTo(f.x, canvas.height - f.height / 2, targetX, currentY);
ctx.stroke();

// Рост стебля
if (f.height < f.maxHeight) {
f.height += f.speed;
} else {
// Распускаем цветок
if (f.bloom < f.maxBloom) f.bloom += 0.2;

// Лепестки
let petalColors = ['#ffffff', '#ffb6c1', '#ffc0cb'];
for (let i = 0; i < 6; i++) {
let angle = (i * Math.PI) / 3;
let px = targetX + Math.cos(angle) * f.bloom;
let py = currentY + Math.sin(angle) * f.bloom;

ctx.fillStyle = petalColors[i % petalColors.length];
ctx.beginPath();
ctx.arc(px, py, f.bloom / 2, 0, Math.PI * 2);
ctx.fill();
}

// Серединка
ctx.fillStyle = '#ffeb3b';
ctx.beginPath();
ctx.arc(targetX, currentY, f.bloom / 3, 0, Math.PI * 2);
ctx.fill();
}
});
}

requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
